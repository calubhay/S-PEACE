<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#15803d" stroke-width="6" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="4,2" />

  <!-- Shield Base -->
  <path d="M100,28 L152,50 C152,105 130,148 100,165 C70,148 48,105 48,50 Z" fill="url(#shieldGrad)" stroke="#ffffff" stroke-width="3" />

  <!-- Torch of Wisdom / Peace -->
  <path d="M96,75 L104,75 L102,115 L98,115 Z" fill="url(#goldGrad)" />
  <path d="M93,75 C93,65 100,52 100,52 C100,52 107,65 107,75 C107,80 93,80 93,75 Z" fill="#ef4444" />
  <path d="M96,74 C96,68 100,60 100,60 C100,60 104,68 104,74 Z" fill="#fbbf24" />

  <!-- Open Book of Knowledge -->
  <path d="M100,122 C90,118 75,119 65,123 L65,142 C75,138 90,137 100,142 C110,137 125,138 135,142 L135,123 C125,119 110,118 100,122 Z" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
  <line x1="100" y1="122" x2="100" y2="142" stroke="#0f172a" stroke-width="2" />

  <!-- S-PEACE Star Ribbon -->
  <rect x="35" y="152" width="130" height="26" rx="13" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
  <text x="100" y="169" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">S-PEACE</text>
</svg>
