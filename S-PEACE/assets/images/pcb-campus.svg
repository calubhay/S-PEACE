<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a90e2" />
      <stop offset="40%" stop-color="#72afd3" />
      <stop offset="70%" stop-color="#bfe3f7" />
      <stop offset="100%" stop-color="#e8f4fc" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ba2d24" />
      <stop offset="50%" stop-color="#9e2018" />
      <stop offset="100%" stop-color="#70120b" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d8a4e" />
      <stop offset="100%" stop-color="#19542e" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="url(#skyGrad)" />

  <!-- Soft Clouds -->
  <ellipse cx="140" cy="110" rx="90" ry="35" fill="#ffffff" opacity="0.8" />
  <ellipse cx="200" cy="95" rx="70" ry="40" fill="#ffffff" opacity="0.9" />
  <ellipse cx="620" cy="130" rx="110" ry="38" fill="#ffffff" opacity="0.75" />
  <ellipse cx="680" cy="115" rx="75" ry="35" fill="#ffffff" opacity="0.85" />

  <!-- Distant Mountains/Hills -->
  <path d="M0,380 Q200,320 400,360 T800,350 L800,600 L0,600 Z" fill="#648972" opacity="0.35" />
  <path d="M0,400 Q250,350 500,380 T800,390 L800,600 L0,600 Z" fill="#446f53" opacity="0.45" />

  <!-- Campus Trees Background -->
  <circle cx="70" cy="400" r="60" fill="#2d6a4f" opacity="0.9" />
  <circle cx="130" cy="410" r="50" fill="#1b4332" opacity="0.9" />
  <circle cx="680" cy="410" r="70" fill="#2d6a4f" opacity="0.9" />
  <circle cx="740" cy="400" r="55" fill="#1b4332" opacity="0.9" />

  <!-- Main Academic Building (Polytechnic College of Botolan) -->
  <!-- Left Wing -->
  <polygon points="120,360 280,360 260,310 140,310" fill="url(#roofGrad)" />
  <rect x="130" y="360" width="140" height="110" fill="url(#wallGrad)" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Windows Left Wing -->
  <rect x="145" y="375" width="25" height="30" fill="#38bdf8" opacity="0.85" rx="3" />
  <rect x="185" y="375" width="25" height="30" fill="#38bdf8" opacity="0.85" rx="3" />
  <rect x="225" y="375" width="25" height="30" fill="#38bdf8" opacity="0.85" rx="3" />
  <rect x="145" y="420" width="25" height="30" fill="#38bdf8" opacity="0.85" rx="3" />
  <rect x="185" y="420" width="25" height="30" fill="#38bdf8" opacity="0.85" rx="3" />
  <rect x="225" y="420" width="25" height="30" fill="#38bdf8" opacity="0.85" rx="3" />

  <!-- Right Wing -->
  <polygon points="520,360 680,360 660,310 540,310" fill="url(#roofGrad)" />
  <rect x="530" y="360" width="140" height="110" fill="url(#wallGrad)" stroke="#cbd5e1" stroke-width="1.5" />
  <!-- Windows Right Wing -->
  <rect x="545" y="375" width="25" height="30" fill="#38bdf8" opacity="0.85" rx="3" />
  <rect x="585" y="375" width="25" height="30" fill="#38bdf8" opacity="0.85" rx="3" />
  <rect x="625" y="375" width="25" height="30" fill="#38bdf8" opacity="0.85" rx="3" />
  <rect x="545" y="420" width="25" height="30" fill="#38bdf8" opacity="0.85" rx="3" />
  <rect x="585" y="420" width="25" height="30" fill="#38bdf8" opacity="0.85" rx="3" />
  <rect x="625" y="420" width="25" height="30" fill="#38bdf8" opacity="0.85" rx="3" />

  <!-- Center Grand Hall & Facade -->
  <polygon points="260,330 540,330 510,260 290,260" fill="url(#roofGrad)" />
  <rect x="270" y="330" width="260" height="150" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <!-- Upper Arch / Signage Band -->
  <rect x="280" y="340" width="240" height="24" fill="#0f172a" rx="4" />
  <text x="400" y="356" fill="#f8fafc" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1.5">POLYTECHNIC COLLEGE OF BOTOLAN</text>

  <!-- Classical Pillars -->
  <rect x="295" y="375" width="18" height="95" fill="#f1f5f9" stroke="#cbd5e1" />
  <rect x="345" y="375" width="18" height="95" fill="#f1f5f9" stroke="#cbd5e1" />
  <rect x="437" y="375" width="18" height="95" fill="#f1f5f9" stroke="#cbd5e1" />
  <rect x="487" y="375" width="18" height="95" fill="#f1f5f9" stroke="#cbd5e1" />

  <!-- Center Double Entrance Glass Doors -->
  <rect x="378" y="385" width="44" height="85" fill="#0284c7" opacity="0.85" rx="4" stroke="#0369a1" stroke-width="2" />
  <line x1="400" y1="385" x2="400" y2="470" stroke="#ffffff" stroke-width="2" />
  <rect x="382" y="395" width="15" height="25" fill="#bae6fd" opacity="0.8" />
  <rect x="403" y="395" width="15" height="25" fill="#bae6fd" opacity="0.8" />

  <!-- Campus Plaza & Green Lawn -->
  <path d="M0,470 L800,470 L800,600 L0,600 Z" fill="url(#grassGrad)" />
  <!-- Concrete Walkway -->
  <polygon points="340,470 460,470 540,600 260,600" fill="#cbd5e1" />
  <line x1="400" y1="470" x2="400" y2="600" stroke="#94a3b8" stroke-dasharray="10,8" stroke-width="2" />

  <!-- Foreground Prominent Red Hip Roof (matching frame 1 foreground) -->
  <path d="M-50,620 L350,470 L850,620 Z" fill="url(#roofGrad)" opacity="0.95" />
  <line x1="350" y1="470" x2="350" y2="600" stroke="#70120b" stroke-width="4" />
</svg>
