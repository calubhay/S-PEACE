<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#1e293b" />
  
  <!-- Ceiling mount -->
  <rect x="180" y="20" width="40" height="20" fill="#64748b" rx="4" />
  <rect x="195" y="40" width="10" height="50" fill="#94a3b8" />
  
  <!-- Fan Motor Core -->
  <circle cx="200" cy="115" r="35" fill="#334155" stroke="#94a3b8" stroke-width="4" />
  <circle cx="200" cy="115" r="16" fill="#0f172a" />

  <!-- Fan Blades (Tilted / Vibrating) -->
  <path d="M165,115 L40,95 C30,93 30,125 40,125 L165,120 Z" fill="#64748b" opacity="0.8" />
  <path d="M235,115 L360,95 C370,93 370,125 360,125 L235,120 Z" fill="#64748b" opacity="0.8" />
  <path d="M200,150 L205,270 C205,280 190,280 190,270 L195,150 Z" fill="#64748b" opacity="0.8" />

  <!-- Sparking Hazard FX -->
  <path d="M225,100 L245,80 L235,95 L260,85 L238,110 Z" fill="#facc15" stroke="#f59e0b" stroke-width="1.5" />
  <path d="M175,100 L155,75 L165,95 L140,85 L162,110 Z" fill="#facc15" stroke="#f59e0b" stroke-width="1.5" />
  
  <!-- Vibration sound waves -->
  <path d="M245,130 Q255,140 245,150" stroke="#ef4444" stroke-width="3" fill="none" stroke-linecap="round" />
  <path d="M255,125 Q268,140 255,155" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- Warning Badge -->
  <rect x="230" y="20" width="150" height="32" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
  <text x="305" y="41" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CRITICAL: SPARKING</text>
</svg>
