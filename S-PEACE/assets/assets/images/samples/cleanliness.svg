<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f8fafc" />
  <!-- Floor line -->
  <line x1="0" y1="230" x2="400" y2="230" stroke="#cbd5e1" stroke-width="3" />

  <!-- Trash Bin Body -->
  <path d="M140,110 L160,230 L240,230 L260,110 Z" fill="#047857" stroke="#065f46" stroke-width="4" />
  <rect x="130" y="95" width="140" height="18" rx="6" fill="#065f46" />
  <!-- Recycle symbol -->
  <circle cx="200" cy="170" r="22" fill="#10b981" opacity="0.3" />
  <path d="M195,160 L205,160 L200,150 Z" fill="#ffffff" />
  <path d="M210,175 L205,183 L200,172 Z" fill="#ffffff" />
  <path d="M190,175 L195,183 L190,172 Z" fill="#ffffff" />

  <!-- Overflowing Trash and wrappers -->
  <ellipse cx="200" cy="95" rx="55" ry="15" fill="#e2e8f0" stroke="#94a3b8" />
  <rect x="180" y="75" width="30" height="25" fill="#f87171" rx="3" transform="rotate(-15 195 87)" />
  <rect x="205" y="80" width="35" height="20" fill="#60a5fa" rx="2" transform="rotate(20 222 90)" />
  <ellipse cx="170" cy="90" rx="14" ry="8" fill="#fbbf24" />
  
  <!-- Litter on floor -->
  <rect x="270" y="225" width="25" height="15" fill="#f87171" rx="2" transform="rotate(10 282 232)" />
  <circle cx="120" cy="226" r="8" fill="#94a3b8" />

  <!-- Badge -->
  <rect x="230" y="20" width="150" height="32" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
  <text x="305" y="41" fill="#b45309" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ISSUE: OVERFLOWING</text>
</svg>
