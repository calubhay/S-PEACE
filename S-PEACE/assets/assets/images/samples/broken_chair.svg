<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f8fafc" />
  <!-- Classroom floor line -->
  <line x1="0" y1="240" x2="400" y2="240" stroke="#cbd5e1" stroke-width="3" />
  
  <!-- Chair Backrest -->
  <rect x="140" y="70" width="120" height="70" rx="8" fill="#d97706" stroke="#92400e" stroke-width="4" />
  <!-- Backrest Slats -->
  <line x1="170" y1="80" x2="170" y2="130" stroke="#78350f" stroke-width="3" />
  <line x1="200" y1="80" x2="200" y2="130" stroke="#78350f" stroke-width="3" />
  <line x1="230" y1="80" x2="230" y2="130" stroke="#78350f" stroke-width="3" />

  <!-- Chair Seat -->
  <rect x="130" y="150" width="140" height="20" rx="4" fill="#b45309" stroke="#78350f" stroke-width="3" />

  <!-- Broken Armrest Desk Pad (Tilted / Cracked) -->
  <g transform="rotate(18 240 135)">
    <rect x="230" y="120" width="110" height="24" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="3" />
    <!-- Crack line -->
    <path d="M280,120 L275,132 L285,144" stroke="#78350f" stroke-width="3" fill="none" />
  </g>

  <!-- Metal Chair Frame Legs -->
  <line x1="145" y1="140" x2="145" y2="250" stroke="#334155" stroke-width="7" stroke-linecap="round" />
  <line x1="255" y1="140" x2="255" y2="250" stroke="#334155" stroke-width="7" stroke-linecap="round" />
  <line x1="170" y1="170" x2="155" y2="250" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <line x1="230" y1="170" x2="245" y2="250" stroke="#475569" stroke-width="6" stroke-linecap="round" />

  <!-- Loose screw falling -->
  <circle cx="270" cy="190" r="5" fill="#64748b" />
  <line x1="265" y1="190" x2="275" y2="190" stroke="#1e293b" stroke-width="2" />

  <!-- Stamp -->
  <rect x="230" y="20" width="150" height="32" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text x="305" y="41" fill="#b45309" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FACILITY: BROKEN CHAIR</text>
</svg>
