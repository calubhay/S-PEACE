<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#f1f5f9" />
  <!-- Restroom Tiles -->
  <pattern id="tiles" width="40" height="40" patternUnits="userSpaceOnUse">
    <rect width="40" height="40" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  </pattern>
  <rect width="400" height="300" fill="url(#tiles)" />
  
  <!-- Sink counter -->
  <rect x="50" y="220" width="300" height="80" fill="#cbd5e1" rx="8" />
  <ellipse cx="200" cy="225" rx="100" ry="25" fill="#94a3b8" />
  
  <!-- Faucet -->
  <path d="M185,225 L185,130 C185,100 215,100 215,130 L215,160" fill="none" stroke="#64748b" stroke-width="16" stroke-linecap="round"/>
  <rect x="175" y="110" width="20" height="15" fill="#475569" rx="3" />
  
  <!-- Water Dripping / Leaking -->
  <path d="M215,175 C215,175 225,190 225,200 C225,206 220,210 215,210 C210,210 205,206 205,200 C205,190 215,175 215,175 Z" fill="#38bdf8" />
  <path d="M215,190 C215,190 222,205 222,215 C222,220 218,225 215,225 C212,225 208,220 208,215 C208,205 215,190 215,190 Z" fill="#0284c7" />
  
  <!-- Water Puddle in Basin -->
  <ellipse cx="200" cy="235" rx="45" ry="12" fill="#38bdf8" opacity="0.75" />
  
  <!-- Status Badge Stamp -->
  <rect x="240" y="20" width="140" height="32" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" />
  <text x="310" y="41" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ISSUE: NO WATER</text>
</svg>
